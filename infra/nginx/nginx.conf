worker_processes auto;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=ingest:10m rate=50r/s;

    upstream ingest {
        server ingest:8080 max_fails=3 fail_timeout=5s;
    }

    upstream api {
        server api:8080 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        client_max_body_size 1m;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # /internal/* is intra-network only (e.g., consumer POST /internal/dlq/republish on :8082); never expose via LB
        location /internal/ {
            return 404;
        }

        location /healthz {
            proxy_pass http://ingest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /metrics {
            proxy_pass http://ingest;
            proxy_set_header Host $host;
        }

        location /v1/telemetry {
            limit_req zone=ingest burst=100 nodelay;
            proxy_pass http://ingest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Content-Type $content_type;
        }

        location /v1/telemetry/batch {
            limit_req zone=ingest burst=100 nodelay;
            proxy_pass http://ingest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        location = /api/fleet/positions/stream {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
        }

        location = /api/alerts {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://ingest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
