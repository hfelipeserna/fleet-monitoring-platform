global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ingest'
    metrics_path: /metrics
    static_configs:
      - targets: ['ingest:8080']
  - job_name: 'consumer'
    metrics_path: /metrics
    static_configs:
      - targets: ['consumer:8081']
  - job_name: 'nats'
    metrics_path: /metrics
    static_configs:
      - targets: ['nats-exporter:7777']
  - job_name: 'nats-varz'
    metrics_path: /
    static_configs:
      - targets: ['nats:8222']
